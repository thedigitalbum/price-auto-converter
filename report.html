<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Report a problem · Price Auto Converter</title>
    <link rel="stylesheet" href="ui.css" />
  </head>
  <body>
    <main class="report-shell">
      <header class="topbar">
        <div class="brand">
          <span class="brandmark" aria-hidden="true">≈</span>
          <div>
            <div class="brandname">Price Auto Converter</div>
            <span class="version" id="ver"></span>
          </div>
        </div>
        <a href="options.html">Settings</a>
      </header>
      <div class="page-head">
        <h1>Report a problem</h1>
      </div>
      <section class="card stack">
        <h2 id="summary">Checking this page…</h2>
        <p class="hint" id="context"></p>
        <p class="notice" id="disclosure">
          No passwords, cookies, form entries or page text are sent. Only the
          site name, conversion settings and redacted diagnostics go to our
          private Google inbox.
        </p>
        <button id="send" class="primary" disabled>Send report</button>
        <p id="message" class="toast" role="status" aria-live="polite"></p>
        <p class="hint">
          <a href="privacy.html">Privacy</a>
        </p>
      </section>
      <details style="margin-top: 22px">
        <summary>Technical details</summary>
        <div class="details-body stack">
          <label for="preview" class="hint">Diagnostics</label
          ><textarea
            id="preview"
            class="report-preview"
            readonly
            spellcheck="false"
          >
Preparing report…</textarea
          >
          <div class="actions">
            <button id="download" disabled>Download JSON</button
            ><button id="clearEvents">Clear error history</button>
          </div>
        </div>
      </details>
    </main>
    <script src="lib.js"></script>
    <script src="diagnostics.js"></script>
    <script src="report-core.js"></script>
    <script src="ui.js"></script>
    <script src="report.js"></script>
  </body>
</html>

name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  validate:
    name: Chrome ${{ matrix.chrome }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        chrome: [minimum, stable]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx playwright install-deps chromium
      - name: Install official Chrome for Testing
        run: python3 scripts/install_test_chrome.py ${{ matrix.chrome }}
      - run: npm test
  release:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Web Store zip
        run: python3 scripts/build_package.py --output "price-auto-converter-${{ github.ref_name }}.zip"
      - name: Create release
        run: gh release create "${{ github.ref_name }}" ./*.zip --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

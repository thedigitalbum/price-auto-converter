name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Web Store zip
        run: zip -r "price-auto-converter-${{ github.ref_name }}.zip" manifest.json background.js content.js content.css lib.js options.html options.js popup.html popup.js fallback-rates.json LICENSE icons
      - name: Create release
        run: gh release create "${{ github.ref_name }}" ./*.zip --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

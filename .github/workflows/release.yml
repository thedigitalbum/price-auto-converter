name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Build Web Store zip
        run: zip -r "price-auto-converter-${{ github.ref_name }}.zip" manifest.json background.js content.js content.css lib.js diagnostics.js ui.js ui.css options.html options.js popup.html popup.js report.html report.js privacy.html fallback-rates.json LICENSE icons
      - name: Create release
        run: gh release create "${{ github.ref_name }}" ./*.zip --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
